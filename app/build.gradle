plugins {
    id 'com.android.application'
    id 'kotlin-android'
}
android {
    namespace 'com.jarvis.assistant'
    compileSdk 34
    defaultConfig {
        applicationId "com.jarvis.assistant"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}
dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    implementation "androidx.core:core-ktx:1.12.0"
}
